<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.openai.com; frame-src https://www.youtube.com https://youtube.com https://youtu.be https://player.vimeo.com https://vimeo.com https://www.tiktok.com https://vm.tiktok.com https://www.instagram.com https://www.facebook.com https://www.twitter.com https://x.com https://www.dailymotion.com https://open.spotify.com;" />
    
    <!-- Primary Meta Tags -->
    <title>JobNest - فرص عمل ونصائح مهنية | خطوتك القادمة تبدأ هنا</title>
    <meta name="title" content="JobNest - فرص عمل ونصائح مهنية | خطوتك القادمة تبدأ هنا" />
    <meta name="description" content="اكتشف آلاف فرص العمل المتاحة في مختلف المجالات. مقالات ونصائح مهنية تساعدك على تطوير مهاراتك والنجاح في مسارك المهني. منصة عربية متخصصة في العمل والوظائف." />
    <meta name="keywords" content="وظائف, فرص عمل, مقالات مهنية, نصائح مهنية, تطوير الذات, سوق العمل, الوظائف المتاحة, العمل في مصر, العمل في السعودية, العمل عن بعد" />
    <meta name="author" content="JobNest" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://yoursite.com/" />
    <meta property="og:title" content="JobNest - فرص عمل ونصائح مهنية" />
    <meta property="og:description" content="اكتشف آلاف فرص العمل المتاحة في مختلف المجالات. مقالات ونصائح مهنية تساعدك على تطوير مهاراتك." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:site_name" content="JobNest" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://yoursite.com/" />
    <meta property="twitter:title" content="JobNest - فرص عمل ونصائح مهنية" />
    <meta property="twitter:description" content="اكتشف آلاف فرص العمل المتاحة في مختلف المجالات." />
    <meta property="twitter:image" content="/og-image.png" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://yoursite.com/" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    
    <!-- Preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Fonts - load with display=swap for better performance -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#059669" />
    <meta name="msapplication-TileColor" content="#059669" />
    
    <!-- Geo Tags -->
    <meta name="geo.region" content="EG" />
    <meta name="geo.placename" content="Egypt" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "JobNest",
      "url": "https://yoursite.com",
      "logo": "https://yoursite.com/logo.png",
      "description": "منصة عربية متخصصة في فرص العمل والنصائح المهنية",
      "sameAs": [
        "https://facebook.com/jobnest",
        "https://twitter.com/jobnest",
        "https://linkedin.com/company/jobnest"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": "Arabic"
      }
    }
    </script>
    
    <!-- Structured Data - WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JobNest",
      "url": "https://yoursite.com",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://yoursite.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      },
      "inLanguage": "ar"
    }
    </script>
    
    <!-- Structured Data - JobPosting -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CollectionPage",
      "name": "JobNest - فرص العمل والوظائف",
      "description": "اكتشف آلاف فرص العمل المتاحة في مختلف المجالات",
      "url": "https://yoursite.com"
    }
    </script>

    <!-- Preconnect to external resources -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//fonts.gstatic.com">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
